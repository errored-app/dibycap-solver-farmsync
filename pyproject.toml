[project]
name = "farmsync-solver"
version = "0.0.0"
description = "FarmsyncSolver Windows desktop app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nicegui[native]==3.16.0",
    "requests>=2.31.0",
    "curl_cffi>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["nicegui_main_file: the entry file the NiceGUI user fixture loads"]
pythonpath = ["."]

[tool.uv]
package = false
