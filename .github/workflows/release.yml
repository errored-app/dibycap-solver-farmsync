# A release is one git tag (spec 11.1). Nothing is ever built on a personal machine.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      # An exact version, not a floating major: setup-uv stopped publishing
      # `@v8` and up after the tj-actions attack, so there is no tag to follow.
      # A bump here is a deliberate edit, which is the point.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --frozen --group build

      - name: Stamp the version from the tag
        id: version
        run: |
          uv run python -m scripts.stamp_version "${{ github.ref_name }}" `
            --module farmsync_solver/_version.py `
            --version-file build/file_version_info.txt >> $env:GITHUB_OUTPUT

      # nicegui-pack, not bare pyinstaller: without NiceGUI's own --add-data the
      # frontend assets are missing and the UI ships blank. --onedir, not --onefile,
      # which unpacks to temp on every launch and draws antivirus heuristics.
      - name: Pack the app
        run: |
          uv run nicegui-pack --onedir --windowed --noconfirm --clean `
            --name FarmsyncSolver `
            --icon assets/FarmsyncSolver.ico `
            main.py

      # nicegui-pack swallows PyInstaller's exit code, so a failed build looks
      # green here. This step is the first one that notices.
      - name: Stamp the version onto the exe properties
        run: |
          uv run pyi-set_version build/file_version_info.txt dist/FarmsyncSolver/FarmsyncSolver.exe

      # Catches the import-time half of a blank window: a missing NiceGUI asset,
      # or a stray print() where --windowed leaves sys.stdout as None.
      #
      # Start-Process, not a direct call: --windowed builds a GUI-subsystem exe,
      # which PowerShell does not wait on, so a direct call leaves $LASTEXITCODE
      # empty and the step goes green whatever the app returned.
      - name: Self-test the built exe
        run: |
          $app = Start-Process -FilePath dist/FarmsyncSolver/FarmsyncSolver.exe `
            -ArgumentList '--selftest' -Wait -PassThru
          "selftest exit=$($app.ExitCode)"
          if ($app.ExitCode -ne 0) { throw "the built exe failed its selftest" }

      - name: Zip the build output
        run: |
          $name = "FarmsyncSolver-${{ steps.version.outputs.version }}-win64.zip"
          Compress-Archive -Path dist/FarmsyncSolver -DestinationPath "dist/$name"

      # windows-latest ships Inno Setup, so it is looked up, not installed.
      # If the image ever drops it, this step says so instead of the build
      # failing later with a path that means nothing.
      - name: Find Inno Setup
        id: inno
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { throw "this runner has no Inno Setup at $iscc" }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      # The bootstrapper, not the full runtime: ~2 MB, and it installs nothing
      # when the runtime is already there. These bytes end up inside the
      # Setup.exe users run, so their Microsoft signature is checked first.
      - name: Fetch the WebView2 bootstrapper
        run: |
          $file = "installer/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile $file
          $signature = Get-AuthenticodeSignature $file
          "status=$($signature.Status) subject=$($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "the WebView2 bootstrapper is not signed" }
          if ($signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') {
            throw "the WebView2 bootstrapper is not signed by Microsoft"
          }

      - name: Build the installer
        run: |
          & "${{ steps.inno.outputs.iscc }}" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /DAppNumericVersion=${{ steps.version.outputs.numeric }} `
            installer/FarmsyncSolver.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer failed to build" }

      - name: Compute the checksums
        run: |
          Get-ChildItem dist -File |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          # A tag holding a dash is a pre-release, which releases/latest skips,
          # so no user's app auto-updates to it.
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/FarmsyncSolver-${{ steps.version.outputs.version }}-win64.zip
            dist/FarmsyncSolver-Setup-${{ steps.version.outputs.version }}.exe
            dist/SHA256SUMS.txt
